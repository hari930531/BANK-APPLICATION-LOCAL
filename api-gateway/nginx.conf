events {}

http {
    upstream frontend_srv {
        server frontend:80;
    }

    upstream account_srv {
        server account-service:5001;
    }

    upstream transfer_srv {
        server transfer-service:5002;
    }

    server {
        listen 80;

        # Frontend Route
        location / {
            proxy_pass http://frontend_srv;
        }

        # Account Service API
        location /api/accounts {
            proxy_pass http://account_srv;
        }

        # Transfer Service API
        location /api/transfer {
            proxy_pass http://transfer_srv;
        }
    }
}